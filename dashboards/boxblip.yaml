              {%- set url = state_attr(e, 'tracking_url') %}
              **{% if dev %}[{{ name }}](/config/devices/device/{{ dev }}){% else %}{{ name }}{% endif %}**
              {%- if carrier %} · {{ carrier }}{% endif %}
              {%- if account %} · {{ account }}{% endif %}
              {%- if is_state_attr(e, 'outgoing', true) %} · in uscita{% endif %}
              {%- if group == 'transit' and end %} · entro {{ when(end) }}{% endif %}
              {%- if url %} · [traccia]({{ url }}){% endif %}<br>
              <small>
              {%- if group in ['transit', 'problems'] %}{{ state_attr(e, 'status_text') or states(e) }} · {% endif %}
