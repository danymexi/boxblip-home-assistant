# Tooling for the BoxBlip Home Assistant integration (not a package).
[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "PT", "BLE", "TC"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "E501", "TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
ignore_missing_imports = true

# Home Assistant 2026.9+ validates with probatio and aliases `voluptuous` to it at
# runtime; the integration keeps `import voluptuous as vol` so it also loads on
# older releases, which makes the schema types differ only for the type checker.
[[tool.mypy.overrides]]
module = ["custom_components.boxblip.config_flow", "custom_components.boxblip.services"]
disable_error_code = ["arg-type"]
